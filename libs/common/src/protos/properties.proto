syntax = "proto3";

package properties;

message Location {
  string type = 1; // "Point"
  repeated double coordinates = 2; // [latitude, longitude]
  string address = 3;
}

message PropertyFeature {
  string name = 1;
  oneof value {
    string string_value = 2;
    int32 int_value = 3;
    bool bool_value = 4;
  }
}

enum PropertyType {
  APARTMENT = 0;
  HOUSE = 1;
  PARKING = 2;
}

enum PropertyStatus {
  AVAILABLE = 0;
  SELL_PENDING = 1;
  SOLD = 2;
  INACTIVE = 3;
  RESERVED = 4;
}

message Property {
  string id = 1;
  optional string agency_id = 2;
  string title = 3;
  optional string description = 4;
  optional PropertyType type = 5;
  double price = 6;
  Location location = 7;
  repeated PropertyFeature features = 8;
  repeated string amenities = 9;
  optional PropertyStatus status = 10;
  optional string user_id = 11;
  optional string created_at = 12;
}

message PropertyList {
  repeated Property data = 1;
  Meta meta = 2;
}

message CreatePropertyRequest {
  optional string agency_id = 1;
  string title = 2;
  optional string description = 3;
  optional PropertyType type = 4;
  double price = 5;
  Location location = 6;
  repeated PropertyFeature features = 7;
  repeated string amenities = 8;
  optional PropertyStatus status = 9;
}

message UpdatePropertyRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional PropertyType type = 4;
  optional double price = 5;
  optional Location location = 6;
  repeated PropertyFeature features = 7;
  repeated string amenities = 8;
  optional PropertyStatus status = 9;
}

message DeletePropertyRequest {
  string id = 1;
}

message GetPropertyByIdRequest {
  string id = 1;
}

message PropertyResponse {
  Property property = 1;
}

message ActionResponse {
  string message = 1;
}

message Meta {
  int32 total = 1;
  int32 lastPage = 2;
  int32 currentPage = 3;
  int32 perPage = 4;
  int32 prev = 5;
  int32 next = 6;
}

service PropertyService {
  rpc create (CreatePropertyRequest) returns (ActionResponse);
  rpc update (UpdatePropertyRequest) returns (ActionResponse);
  rpc delete (DeletePropertyRequest) returns (ActionResponse);
  rpc findOne (GetPropertyByIdRequest) returns (PropertyResponse);
  rpc findAll (PropertyProps) returns (PropertyList);
}

message PropertyProps {
  optional int32 perPage = 1;
  optional int32 page = 2;
}

