syntax = "proto3";

package users;

message User {
  string id = 1;
  string name = 3;
  string last_name = 4;
  string username = 5;
  string email = 6;
  optional string phone = 7;
  optional string role = 8;
  optional string created_at = 9;
  optional string status = 10;
  string dni = 11;
  optional string expires_at = 12;
}

message UserList {
  repeated User data = 1;
  Meta meta = 2;
}

message CreateUserRequest {
  string name = 2;
  string last_name = 3;
  string username = 4;
  string email = 5;
  string password = 6;
  optional string phone = 7;
  optional string role = 8;
  string dni = 9;
}

message UpdateUserRequest {
  string id = 1;
  optional string name = 2;
  optional string last_name = 3;
  optional string username = 4;
  optional string email = 5;
  optional string phone = 6;
  optional string role = 7;
  optional string status = 8;
}

message DeleteUserRequest {
  string id = 1;
}

message GetUserByIdRequest {
  string id = 1;
}

message UserResponse {
  User user = 1;
}

message ActionResponse {
  string message = 1;
}

message Meta {
  int32 total = 1;
  int32 lastPage = 2;
  int32 currentPage = 3;
  int32 perPage = 4;
  int32 prev = 5;
  int32 next = 6;
}

service UserService {
  rpc CreateUser (CreateUserRequest) returns (ActionResponse);
  rpc UpdateUser (UpdateUserRequest) returns (ActionResponse);
  rpc DeleteUser (DeleteUserRequest) returns (ActionResponse);
  rpc GetUserById (GetUserByIdRequest) returns (UserResponse);
  rpc ListUsers (Empty) returns (UserList);
}

message Empty {}
