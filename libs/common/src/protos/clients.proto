syntax = "proto3";

package clients;

import "google/protobuf/timestamp.proto";

// Modelo de cliente basado en la respuesta esperada
message Client {
  int32 id = 1;
  string dni = 2;
  string lastName = 3;
  string address = 4;
  string name = 5;
  string email = 6;
  string phone = 7;
  google.protobuf.Timestamp createdAt = 8;
}

// DTO para crear un cliente (POST request)
message CreateClientRequest {
  string dni = 1;
  string lastName = 2;
  string address = 3;
  string name = 4;
  string email = 5;
  string phone = 6;
}

// Respuesta del endpoint de creación
message CreateClientResponse {
  string message = 1;
}

// DTO para obtener un cliente por ID
message FindOneClientRequest {
  string id = 1;
}

// Respuesta al obtener un cliente
message FindOneClientResponse {
  Client client = 1;
}

// DTO para actualizar un cliente
message UpdateClientRequest {
  string id = 1;
  string dni = 2;
  string lastName = 3;
  string address = 4;
  string name = 5;
  string email = 6;
  string phone = 7;
}

// Respuesta a la actualización
message UpdateClientResponse {
  string message = 1;
}

// DTO para eliminar un cliente
message DeleteClientRequest {
  string id = 1;
}

// Respuesta a la eliminación
message DeleteClientResponse {
  string message = 1;
}

// Definir la estructura de paginación
message PaginationMeta {
  int32 total = 1;
  int32 lastPage = 2;
  int32 currentPage = 3;
  int32 perPage = 4;
  int32 prev = 5;
  int32 next = 6;
}

message PaginatedClientsResponse {
  repeated Client data = 1;
  PaginationMeta meta = 2;
}

// Servicio de clientes
service ClientsService {
  rpc create(CreateClientRequest) returns (CreateClientResponse);
  rpc findAll(ClientProps) returns (PaginatedClientsResponse);
  rpc findOne(FindOneClientRequest) returns (FindOneClientResponse);
  rpc update(UpdateClientRequest) returns (UpdateClientResponse);
  rpc delete(DeleteClientRequest) returns (DeleteClientResponse);
}

message ClientProps {
  optional int32 perPage = 1;
  optional int32 page = 2;
}
