name: Deploy to EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  DATABASE_URL: ${{ vars.DATABASE_URL }}
  DATABASE_SERVICE_PORT: ${{ vars.DATABASE_SERVICE_PORT }}
  USER_MANAGEMENT_SERVICE_PORT: ${{ vars.USER_MANAGEMENT_SERVICE_PORT }}
  GATEWAY_PORT: ${{ vars.GATEWAY_PORT }}
  PROPERTIES_SERVICE_PORT: ${{ vars.PROPERTIES_SERVICE_PORT }}
  NODE_ENV: ${{ vars.NODE_ENV }}
  JWT_SECRET: ${{ vars.JWT_SECRET }}
  JWT_REFRESH_SECRET: ${{ vars.JWT_REFRESH_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH and Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
            set -e

            docker system prune -af --volumes || true

            sudo rm -rf ~/inmobiliaria-back
            git clone https://github.com/jcsoftdev/inmobiliaria-back.git ~/inmobiliaria-back

            cd ~/inmobiliaria-back
            git checkout develop
            git pull origin develop

            echo -e "DATABASE_URL=${{ env.DATABASE_URL }}\nDATABASE_SERVICE_PORT=${{ env.DATABASE_SERVICE_PORT }}\nUSER_MANAGEMENT_SERVICE_PORT=${{ env.USER_MANAGEMENT_SERVICE_PORT }}\nGATEWAY_PORT=${{ env.GATEWAY_PORT }}\nPROPERTIES_SERVICE_PORT=${{ env.PROPERTIES_SERVICE_PORT }}\nNODE_ENV=${{ env.NODE_ENV }}\nJWT_SECRET=${{ env.JWT_SECRET }}\nJWT_REFRESH_SECRET=${{ env.JWT_REFRESH_SECRET }}" > .env

            docker-compose up --no-deps --build -d

            for i in {1..10}; do
              STATUS=\$(docker inspect --format='{{.State.Status}}' inmobiliaria-app 2>/dev/null || echo "not_found")
              if [ "\$STATUS" = "running" ]; then break; fi
              if [ "\$STATUS" = "exited" ] || [ "\$STATUS" = "dead" ]; then
                docker logs inmobiliaria-app
                exit 1
              fi
              [ "\$i" -eq 10 ] && docker logs inmobiliaria-app && exit 1
              sleep 5
            done

            nc -z 127.0.0.1 3000 || exit 1

            echo "🔍 Waiting for HTTP server to respond on port 3000"
            for i in {1..10}; do
              if curl -s http://127.0.0.1:3000 > /dev/null; then
                echo "✅ HTTP server is up!"
                break
              fi
              echo "⏳ Attempt \$i: Server not ready yet. Retrying in 3s..."
              sleep 3
              if [ "\$i" -eq 10 ]; then
                echo "❌ Server did not respond after multiple attempts."
                docker logs inmobiliaria-app
                exit 1
              fi
            done

            sudo nginx -t && sudo systemctl restart nginx
            curl -sSf http://justfordevelopment.tech > /dev/null || exit 1

            docker image prune -f
            docker container prune -f
          EOF
