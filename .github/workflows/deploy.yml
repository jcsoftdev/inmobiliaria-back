name: Deploy to EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH and Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << "EOF"
            set -e

            echo "🔧 Configuring environment variables on EC2..."
            echo "export DATABASE_URL=${{ secrets.DATABASE_URL }}" | sudo tee -a /etc/environment

            echo "🧼 Cleaning up unused Docker resources (containers, images, networks, volumes)..."
            docker system prune -af --volumes || true

            echo "🔄 Backing up old environment if it exists..."
            if [ -f ~/inmobiliaria-back/.env ]; then
              mv ~/inmobiliaria-back/.env ~/.env_backup
            fi

            echo "🧹 Removing previous project directory..."
            sudo rm -rf ~/inmobiliaria-back

            echo "📥 Cloning repository..."
            git clone https://github.com/jcsoftdev/inmobiliaria-back.git ~/inmobiliaria-back

            echo "📦 Restoring .env file..."
            if [ -f ~/.env_backup ]; then
              mv ~/.env_backup ~/inmobiliaria-back/.env
            fi

            echo "🔄 Updating DATABASE_URL in .env file..."
            sed -i '/^DATABASE_URL=/d' ~/inmobiliaria-back/.env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> ~/inmobiliaria-back/.env

            cd ~/inmobiliaria-back

            echo "📂 Listing .env contents (sanitized):"
            grep -v 'SECRET\|PASSWORD\|TOKEN' .env || echo "(no .env or all vars are sensitive)"

            if ! command -v nc &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y netcat
            fi

            echo "🔌 Testing DATABASE_URL TCP connection..."
            DATABASE_URL=$(grep DATABASE_URL .env | cut -d '=' -f2-)

            HOST=$(echo "$DATABASE_URL" | sed -E 's|.*@([^:/]+):([0-9]+).*|\1|')
            PORT=$(echo "$DATABASE_URL" | sed -E 's|.*@([^:/]+):([0-9]+).*|\2|')

            echo "Parsed DB host: $HOST"
            echo "Parsed DB port: $PORT"

            nc -zv $HOST $PORT || echo "❌ Could not connect to DB host/port"

            echo "🔀 Checking out develop branch..."
            git checkout develop
            git pull origin develop

            echo "📁 Showing files before build:"
            ls -la

            echo "📦 Showing Docker version and system info:"
            docker --version
            docker info

            echo "🐳 Building and starting Docker containers..."
            docker-compose up --no-deps --build

            echo "📦 Showing docker images:"
            docker images

            echo "📦 Showing docker containers:"
            docker ps -a

            echo "⏳ Waiting for inmobiliaria-app container to be running..."
            for i in {1..10}; do
              STATUS=$(docker inspect --format='{{.State.Status}}' inmobiliaria-app 2>/dev/null || echo "not_found")
              echo "Attempt $i: Container status is '$STATUS'"

              if [ "$STATUS" = "running" ]; then
                echo "✅ inmobiliaria-app is running!"
                break
              fi

              if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "❌ Container failed to start (status: $STATUS)"
                docker logs inmobiliaria-app
                exit 1
              fi

              if [ "$i" -eq 10]; then
                echo "❌ Timeout: Container did not reach running status in time."
                docker logs inmobiliaria-app
                exit 1
              fi

              sleep 5
            done

            echo "🧪 Listing processes inside container..."
            docker exec inmobiliaria-app ps aux || echo "⚠️ Could not list processes"

            echo "🔎 Checking ports inside container..."
            docker exec inmobiliaria-app ss -tulpn || echo "⚠️ Could not inspect open ports"

            echo "🔍 Showing environment variables inside container (sanitized):"
            docker exec inmobiliaria-app printenv | grep -v 'SECRET\|TOKEN\|PASSWORD' || echo "⚠️ Could not list env vars"

            echo "⏳ Waiting for port 3000 to respond inside container..."
            for i in {1..10}; do
              nc -z 127.0.0.1 3000 && echo "✅ Port 3000 is up!" && break
              echo "Attempt $i: Port 3000 not ready yet..."
              sleep 5
              if [ "$i" -eq 10]; then
                echo "❌ Timeout waiting for port 3000"
                docker logs inmobiliaria-app
                exit 1
              fi
            done

            echo "📡 Curling app directly (http://127.0.0.1:3000)..."
            curl -I http://127.0.0.1:3000 || {
              echo "❌ App not responding on port 3000"
              docker logs inmobiliaria-app
            }

            echo "📜 Showing last 100 lines of app logs:"
            docker logs inmobiliaria-app --tail 100

            echo "🔍 Verifying app container status..."
            docker ps

            echo "🧠 Checking Nginx config syntax..."
            sudo nginx -t || echo "❌ Invalid nginx config"

            echo "🔁 Restarting Nginx service..."
            sudo systemctl restart nginx

            echo "📄 Last 20 lines of Nginx access log:"
            sudo tail -n 20 /var/log/nginx/access.log || echo "❌ Could not read Nginx access logs"

            echo "📄 Last 20 lines of Nginx error log:"
            sudo tail -n 20 /var/log/nginx/error.log || echo "❌ Could not read Nginx error logs"

            echo "🌐 Testing public endpoint (Nginx):"
            curl -IL http://justfordevelopment.tech || echo "❌ Nginx is not serving correctly"

            echo "🧼 Cleaning unused images and containers..."
            docker image prune -f
            docker container prune -f

          EOF