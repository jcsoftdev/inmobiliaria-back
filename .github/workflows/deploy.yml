name: Deploy to EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  DATABASE_URL: ${{ vars.DATABASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH and Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
            set -e

            docker system prune -af --volumes || true

            if [ -f ~/inmobiliaria-back/.env ]; then
              mv ~/inmobiliaria-back/.env ~/.env_backup
            fi

            sudo rm -rf ~/inmobiliaria-back
            git clone https://github.com/jcsoftdev/inmobiliaria-back.git ~/inmobiliaria-back

            if [ -f ~/.env_backup ]; then
              mv ~/.env_backup ~/inmobiliaria-back/.env
            fi

            # Parse and construct a valid DATABASE_URL
            RAW_DATABASE_URL="${{ vars.DATABASE_URL }}"
            ESCAPED_DATABASE_URL=$(echo "$RAW_DATABASE_URL" | sed -e 's/#/%23/g' -e 's/</%3C/g' -e 's/>/%3E/g' -e 's/\[/%5B/g' -e 's/\]/%5D/g')

            # Remove existing DATABASE_URL from .env
            sed -i '/^DATABASE_URL=/d' ~/inmobiliaria-back/.env

            # Add the escaped DATABASE_URL to .env
            echo "DATABASE_URL=$ESCAPED_DATABASE_URL" >> ~/inmobiliaria-back/.env

            cd ~/inmobiliaria-back
            git checkout develop
            git pull origin develop

            docker-compose up --no-deps --build

            for i in {1..10}; do
              STATUS=$(docker inspect --format='{{.State.Status}}' inmobiliaria-app 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "running" ]; then
                break
              fi
              if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                docker logs inmobiliaria-app
                exit 1
              fi
              [ "$i" -eq 10 ] && docker logs inmobiliaria-app && exit 1
              sleep 5
            done

            nc -z 127.0.0.1 3000 || {
              docker logs inmobiliaria-app
              exit 1
            }

            curl -sSf http://127.0.0.1:3000 > /dev/null || {
              docker logs inmobiliaria-app
              exit 1
            }

            sudo nginx -t && sudo systemctl restart nginx

            curl -sSf http://justfordevelopment.tech > /dev/null || exit 1

            docker image prune -f
            docker container prune -f
          EOF
