version: '3.8'

services:
  app:
    build: .
    container_name: inmobiliaria-app
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
    env_file:
      - .env
    depends_on:
      - migrate

  migrate:
    image: node:20
    container_name: prisma-migrate
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    env_file:
      - .env
    command: ["sh", "-c", "npm install && npx prisma migrate deploy"]
